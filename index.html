<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X Tube - Tech Videos & Courses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00ff00;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --text-light: #ffffff;
            --card-bg: #1a1a1a;
            --border-color: #2a2a2a;
            --glow-color: #00ff00;
        }

        body.light-mode {
            --bg-dark: #f5f5f5;
            --bg-darker: #ffffff;
            --text-light: #1a1a1a;
            --card-bg: #eeeeee;
            --border-color: #cccccc;
            --glow-color: #00cc00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        /* ===== HEADER ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 2px solid var(--glow-color);
            padding: 15px 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
            transition: all 0.3s ease;
        }

        body.light-mode header {
            background: rgba(245, 245, 245, 0.95);
            border-bottom-color: #00cc00;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .logo-section:hover {
            transform: scale(1.05);
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--glow-color), #00cc00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--glow-color), #00cc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .search-container {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 15px;
            background: var(--card-bg);
            border: 2px solid var(--glow-color);
            border-radius: 25px;
            color: var(--text-light);
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .search-bar:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            transform: scale(1.05);
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        body.light-mode .search-bar::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }

        /* ===== NAVIGATION ===== */
        .nav-bar {
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 0;
            overflow-x: auto;
            display: flex;
            transition: all 0.3s ease;
        }

        body.light-mode .nav-bar {
            background: rgba(245, 245, 245, 0.95);
        }

        .nav-items {
            display: flex;
            gap: 0;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        body.light-mode .nav-item {
            color: rgba(0, 0, 0, 0.7);
        }

        .nav-item:hover {
            color: var(--glow-color);
            border-bottom-color: var(--glow-color);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .nav-item.active {
            color: var(--glow-color);
            border-bottom-color: var(--glow-color);
            box-shadow: inset 0 -3px 0 var(--glow-color);
        }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            gap: 20px;
            padding: 20px;
            min-height: calc(100vh - 250px);
        }

        /* ===== CONTENT AREA ===== */
        .content-area {
            flex: 1;
            min-width: 0;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== VIDEO GRID ===== */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .video-card:hover {
            border-color: var(--glow-color);
            transform: translateY(-8px);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
        }

        .thumbnail {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            position: relative;
            overflow: hidden;
        }

        body.light-mode .thumbnail {
            background: linear-gradient(135deg, #e0e0e0, #f0f0f0);
        }

        .view-count {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0, 255, 0, 0.2);
            color: var(--glow-color);
            padding: 3px 7px;
            border-radius: 10px;
            font-size: 11px;
            border: 1px solid var(--glow-color);
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
        }

        .video-info {
            padding: 15px;
        }

        .video-title {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
            color: var(--text-light);
            transition: color 0.3s;
            margin-bottom: 8px;
        }

        .video-card:hover .video-title {
            color: var(--glow-color);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .video-category {
            display: inline-block;
            font-size: 10px;
            color: var(--glow-color);
            background: rgba(0, 255, 0, 0.1);
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid var(--glow-color);
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 30px 0;
            flex-wrap: wrap;
            align-items: center;
        }

        .page-btn {
            padding: 10px 14px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-light);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 13px;
        }

        .page-btn:hover {
            border-color: var(--glow-color);
            color: var(--glow-color);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .page-btn.active {
            background: var(--glow-color);
            color: var(--bg-dark);
            border-color: var(--glow-color);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== COMING SOON PAGE ===== */
        .coming-soon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
            color: var(--glow-color);
        }

        .coming-soon-text {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .coming-soon-emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ===== DETAIL PAGE ===== */
        .detail-page {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            overflow-y: auto;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .detail-page.active {
            display: block;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 2px solid var(--glow-color);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            position: relative;
        }

        .detail-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: var(--glow-color);
            border: none;
            color: var(--bg-dark);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2001;
        }

        .detail-close:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .detail-thumbnail {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            margin-bottom: 20px;
            border: 2px solid var(--glow-color);
        }

        .detail-title {
            font-size: 26px;
            margin-bottom: 12px;
            color: var(--glow-color);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .detail-category {
            display: inline-block;
            background: rgba(0, 255, 0, 0.1);
            color: var(--glow-color);
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid var(--glow-color);
            margin-bottom: 20px;
            font-size: 13px;
        }

        .detail-section {
            margin-bottom: 25px;
        }

        .detail-section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--glow-color);
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.2);
        }

        .detail-description {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--glow-color);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .link-item:hover {
            background: rgba(0, 255, 0, 0.1);
            transform: translateX(5px);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .link-item a {
            flex: 1;
            color: var(--glow-color);
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .link-item a:hover {
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .link-icon {
            width: 30px;
            height: 30px;
            background: var(--glow-color);
            color: var(--bg-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--glow-color);
            border-radius: 15px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.2);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--glow-color);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-close:hover {
            transform: rotate(90deg);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .modal-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--glow-color);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--glow-color);
            font-weight: bold;
            font-size: 14px;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            color: var(--text-light);
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
            cursor: pointer;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--glow-color);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background: var(--glow-color);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        /* ===== FOOTER ===== */
        footer {
            background: rgba(10, 10, 10, 0.95);
            border-top: 2px solid var(--glow-color);
            padding: 30px 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
            transition: all 0.3s ease;
        }

        body.light-mode footer {
            background: rgba(245, 245, 245, 0.95);
            color: rgba(0, 0, 0, 0.7);
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--glow-color);
            text-decoration: none;
            transition: all 0.3s;
        }

        .footer-links a:hover {
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            transform: scale(1.1);
        }

        .footer-text {
            font-size: 13px;
        }

        /* ===== NO DATA ===== */
        .no-data {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 12px;
            }

            .search-container {
                width: 100%;
                max-width: 100%;
            }

            .logo-text {
                font-size: 20px;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .detail-container {
                padding: 20px;
            }

            .detail-thumbnail {
                height: 200px;
                font-size: 50px;
            }

            .detail-title {
                font-size: 20px;
            }

            .coming-soon-text {
                font-size: 32px;
            }

            .coming-soon-emoji {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-content">
            <div class="logo-section" onclick="refreshPage()">
                <div class="logo-img">10</div>
                <div class="logo-text">X TUBE</div>
            </div>
            <div class="search-container">
                <input type="text" class="search-bar" id="searchInput" placeholder="Search videos...">
            </div>
        </div>
    </header>

    <!-- NAVIGATION -->
    <nav class="nav-bar">
        <div class="nav-items">
            <div class="nav-item active" onclick="switchPage('home')">🏠 Home</div>
            <div class="nav-item" onclick="switchPage('courses')">📚 Courses</div>
            <div class="nav-item" onclick="switchPage('settings')">⚙️ Settings</div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <div class="main-container">
        <!-- CONTENT AREA -->
        <section class="content-area">
            <!-- HOME PAGE -->
            <div class="page active" id="homepage">
                <div class="video-grid" id="videoGrid"></div>
                <div class="no-data" id="noData" style="display: none;">
                    <p>😔 No videos found</p>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>

            <!-- COURSES PAGE -->
            <div class="page" id="coursespage">
                <div class="coming-soon">
                    <div class="coming-soon-emoji">🎓</div>
                    <div class="coming-soon-text">Coming Soon</div>
                </div>
            </div>

            <!-- SETTINGS PAGE -->
            <div class="page" id="settingspage">
                <div style="background: var(--card-bg); border: 2px solid var(--glow-color); border-radius: 12px; padding: 30px; max-width: 600px;">
                    <h2 style="color: var(--glow-color); margin-bottom: 30px;">⚙️ Settings</h2>
                    
                    <div class="form-group">
                        <label>🌈 Theme</label>
                        <select id="themeSelect">
                            <option value="dark">🌙 Dark Mode</option>
                            <option value="light">☀️ Light Mode</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>🗣️ Language</label>
                        <select id="languageSelect">
                            <option value="bengali">🇧🇩 বাংলা</option>
                            <option value="english">🇬🇧 English</option>
                            <option value="hindi">🇮🇳 हिन्दी</option>
                        </select>
                    </div>

                    <button class="btn-submit" onclick="saveSettings()">✅ Save Settings</button>
                </div>
            </div>
        </section>
    </div>

    <!-- DETAIL PAGE -->
    <div class="detail-page" id="detailPage">
        <button class="detail-close" onclick="closeDetail()">&times;</button>
        <div class="detail-container">
            <div class="detail-thumbnail" id="detailThumbnail"></div>
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-category" id="detailCategory"></div>

            <div class="detail-section">
                <div class="detail-section-title">📝 Description</div>
                <div class="detail-description" id="detailDescription"></div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">📚 Resources & Links</div>
                <div class="links-container" id="linksContainer"></div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">📊 Info</div>
                <div style="color: rgba(255, 255, 255, 0.8);">
                    <p>Total Views: <span id="detailViews" style="color: var(--glow-color);">0</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
                <a href="#privacy">Privacy</a>
                <a href="#terms">Terms</a>
            </div>
            <div class="footer-text">
                &copy; 2026 10X Tube. All rights reserved. | Learn Tech, Grow Fast 🚀
            </div>
        </div>
    </footer>

    <script>
        // ===== FULL LANGUAGE TRANSLATIONS =====
        const translations = {
            bengali: {
                searchPlaceholder: 'ভিডিও সার্চ করুন...',
                home: '🏠 হোম',
                courses: '📚 কোর্স',
                settings: '⚙️ সেটিংস',
                noVideos: '😔 কোনো ভিডিও খুঁজে পাওয়া যায়নি',
                themeLabel: '🌈 থিম',
                darkMode: '🌙 ডার্ক মোড',
                lightMode: '☀️ লাইট মোড',
                languageLabel: '🗣️ ভাষা',
                bengaliLang: '🇧🇩 বাংলা',
                englishLang: '🇬🇧 English',
                hindiLang: '🇮🇳 हिन्दी',
                saveBtn: '✅ সংরক্ষণ করুন',
                description: '📝 বিবরণ',
                resources: '📚 রিসোর্স এবং লিংক',
                info: '📊 তথ্য',
                totalViews: 'মোট ভিউ:',
                about: 'সম্পর্কে',
                contact: 'যোগাযোগ করুন',
                privacy: 'গোপনীয়তা নীতি',
                terms: 'শর্তাবলী',

            },

                saveBtn: '✅ Save Settings',

                resources: '📚 Resources & Links',

                privacy: 'Privacy',
                terms: 'Terms',

            },
            hindi: {
                searchPlaceholder: 'वीडियो खोजें...',
                home: '🏠 होम',
                courses: '📚 कोर्स',
                settings: '⚙️ सेटिंग्स',
                noVideos: '😔 कोई वीडियो नहीं मिला',
                themeLabel: '🌈 थीम',
                darkMode: '🌙 डार्क मोड',
                lightMode: '☀️ लाइट मोड',
                languageLabel: '🗣️ भाषा',
                bengaliLang: '🇧🇩 বাংলা',
                englishLang: '🇬🇧 English',
                hindiLang: '🇮🇳 हिन्दी',
                saveBtn: '✅ सेटिंग्स सहेजें',
                description: '📝 विवरण',
                resources: '📚 संसाधन और लिंक',
                info: '📊 जानकारी',
                totalViews: 'कुल दृश्य:',
                about: 'परिचय',
                contact: 'संपर्क करें',
                privacy: 'गोपनीयता',
                terms: 'शर्तें',
                footerText: '&copy; 2026 10X Tube. सर्वाधिकार सुरक्षित। | तकनीक सीखें, तेजी से बढ़ें 🚀'
            }
        };

        // ===== DATA - ONLY 2 VIDEOS =====
        const videosData = [
            {
                id: 1,
                title: '२०२६ সালে সেরা ৫টা ফ্রি অ্যাপ 🔥 (Must Try Apps!)',
                category: 'অ্যাপস',
                emoji: '📱',
                description: 'এই ভিডিওতে আমরা দেখাচ্ছি २०२६ সালের সবচেয়ে দরকারী এবং ফ্রি অ্যাপ্লিকেশন যা আপনার দৈনন্দিন কাজকে আরও সহজ করে তুলবে।',
                links: [
                    { name: 'YouTube ভিডিও', url: '#' },
                    { name: 'Google Drive (প্রম্পট)', url: '#' },
                    { name: 'অ্যাপ লিস্ট PDF', url: '#' }
                ]
            },
            {
                id: 2,
                title: 'এই ট্রিকটা জানলে তোমার মোবাইল 2x ফাস্ট হবে 😱',
                category: 'মোবাইল টিপস',
                emoji: '⚡',
                description: 'আপনার মোবাইলের গতি বাড়ানোর সবচেয়ে কার্যকর উপায়গুলি শিখুন এই ভিডিওতে। সাধারণ সেটিংস পরিবর্তন করে আপনার ফোনকে রকেটের মতো দ্রুত করে তুলুন।',
                links: [
                    { name: 'YouTube ভিডিও', url: '#' },
                    { name: 'স্টেপ বাই স্টেপ গাইড', url: '#' },
                    { name: 'সেটিংস কনফিগ ফাইল', url: '#' }
                ]
            }
        ];

        let currentLanguage = 'bengali';
        let currentPage = 1;
        let filteredVideos = [...videosData];
        const videosPerPage = 12;
        let viewCounts = {};

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            renderVideos();
            loadViewCounts();
            applyLanguage();
        });

        // ===== LOAD VIEW COUNTS =====
        function loadViewCounts() {
            const stored = localStorage.getItem('viewCounts');
            if (stored) {
                viewCounts = JSON.parse(stored);
            } else {
                videosData.forEach(video => {
                    viewCounts[video.id] = 0;
                });
            }
        }

        function saveViewCounts() {
            localStorage.setItem('viewCounts', JSON.stringify(viewCounts));
        }

        function incrementViewCount(videoId) {
            if (!viewCounts[videoId]) {
                viewCounts[videoId] = 0;
            }
            viewCounts[videoId]++;
            saveViewCounts();
        }

        // ===== REFRESH PAGE =====
        function refreshPage() {
            location.reload();
        }

        // ===== SWITCH PAGE =====
        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if (pageName === 'home') document.getElementById('homepage').classList.add('active');
            else if (pageName === 'courses') document.getElementById('coursespage').classList.add('active');
            else if (pageName === 'settings') document.getElementById('settingspage').classList.add('active');
            
            event.target.classList.add('active');
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        // ===== SAVE SETTINGS =====
        function saveSettings() {
            const theme = document.getElementById('themeSelect').value;
            const language = document.getElementById('languageSelect').value;
            
            localStorage.setItem('theme', theme);
            localStorage.setItem('language', language);
            
            currentLanguage = language;
            
            if (theme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
            
            applyLanguage();
            
            const t = translations[currentLanguage];
            alert('✅ ' + (currentLanguage === 'bengali' ? 'সেটিংস সংরক্ষণ করা হয়েছে!' : currentLanguage === 'english' ? 'Settings saved!' : 'सेटिंग्स सहेजे गए!'));
        }

        // ===== APPLY LANGUAGE =====
        function applyLanguage() {
            const t = translations[currentLanguage];
            
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.querySelectorAll('.nav-item')[0].textContent = t.home;
            document.querySelectorAll('.nav-item')[1].textContent = t.courses;
            document.querySelectorAll('.nav-item')[2].textContent = t.settings;
            
            document.getElementById('noData').innerHTML = `<p>${t.noVideos}</p>`;
            
            // Update settings page
            const settingsPage = document.getElementById('settingspage');
            settingsPage.innerHTML = `
                <div style="background: var(--card-bg); border: 2px solid var(--glow-color); border-radius: 12px; padding: 30px; max-width: 600px;">
                    <h2 style="color: var(--glow-color); margin-bottom: 30px;">⚙️ ${currentLanguage === 'bengali' ? 'সেটিংস' : currentLanguage === 'english' ? 'Settings' : 'सेटिंग्स'}</h2>
                    
                    <div class="form-group">
                        <label>${t.themeLabel}</label>
                        <select id="themeSelect">
                            <option value="dark">${t.darkMode}</option>
                            <option value="light">${t.lightMode}</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>${t.languageLabel}</label>
                        <select id="languageSelect">
                            <option value="bengali">${t.bengaliLang}</option>
                            <option value="english">${t.englishLang}</option>
                            <option value="hindi">${t.hindiLang}</option>
                        </select>
                    </div>

                    <button class="btn-submit" onclick="saveSettings()">${t.saveBtn}</button>
                </div>
            `;
            
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const savedLanguage = localStorage.getItem('language') || 'bengali';
            document.getElementById('themeSelect').value = savedTheme;
            document.getElementById('languageSelect').value = savedLanguage;
            
            // Update detail page
            if (document.getElementById('detailPage').classList.contains('active')) {
                document.querySelectorAll('.detail-section-title')[0].textContent = t.description;
                document.querySelectorAll('.detail-section-title')[1].textContent = t.resources;
                document.querySelectorAll('.detail-section-title')[2].textContent = t.info;
            }
        }

        // ===== LOAD SETTINGS =====
        function loadSettings() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const savedLanguage = localStorage.getItem('language') || 'bengali';
            
            currentLanguage = savedLanguage;
            
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        }

        // ===== SEARCH =====
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            currentPage = 1;

            if (searchTerm.trim() === '') {
                filteredVideos = [...videosData];
            } else {
                filteredVideos = videosData.filter(v => 
                    v.title.toLowerCase().includes(searchTerm)
                );
            }

            renderVideos();
        });

        // ===== RENDER VIDEOS =====
        function renderVideos() {
            const start = (currentPage - 1) * videosPerPage;
            const end = start + videosPerPage;
            const videosToShow = filteredVideos.slice(start, end);

            const grid = document.getElementById('videoGrid');
            const noData = document.getElementById('noData');

            if (videosToShow.length === 0) {
                grid.innerHTML = '';
                noData.style.display = 'block';
            } else {
                noData.style.display = 'none';
                grid.innerHTML = videosToShow.map(video => `
                    <div class="video-card" onclick="openDetail(${video.id})">
                        <div class="thumbnail">
                            ${video.emoji}
                            <div class="view-count">${viewCounts[video.id] || 0} 👀</div>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-category">${video.category}</div>
                        </div>
                    </div>
                `).join('');
            }

            renderPagination();
        }

        // ===== PAGINATION =====
        function renderPagination() {
            const totalPages = Math.ceil(filteredVideos.length / videosPerPage);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" 
                    onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Previous</button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" 
                    onclick="goToPage(${i})">${i}</button>`;
            }

            html += `
                <button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" 
                    onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>
            `;

            pagination.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderVideos();
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        // ===== DETAIL PAGE =====
        function openDetail(videoId) {
            const video = videosData.find(v => v.id === videoId);
            if (!video) return;

            incrementViewCount(videoId);

            const t = translations[currentLanguage];
            
            document.getElementById('detailThumbnail').textContent = video.emoji;
            document.getElementById('detailTitle').textContent = video.title;
            document.getElementById('detailCategory').textContent = video.category;
            document.getElementById('detailDescription').textContent = video.description;
            document.getElementById('detailViews').textContent = viewCounts[videoId];

            document.querySelectorAll('.detail-section-title')[0].textContent = t.description;
            document.querySelectorAll('.detail-section-title')[1].textContent = t.resources;
            document.querySelectorAll('.detail-section-title')[2].textContent = t.info;

            const linksContainer = document.getElementById('linksContainer');
            linksContainer.innerHTML = video.links.map((link, idx) => `
                <div class="link-item">
                    <div class="link-icon">${idx + 1}</div>
                    <a href="${link.url}" target="_blank">${link.name}</a>
                </div>
            `).join('');

            document.getElementById('detailPage').classList.add('active');
            document.body.style.overflow = 'hidden';
            
            renderVideos();
        }

        function closeDetail() {
            document.getElementById('detailPage').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===== CLOSE MODALS ON ESCAPE =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('detailPage').classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        });
    </script>
</body>
